font_family Fira Code
font_size 13.0
foreground #dce7ee
background #09131d
selection_foreground #09131d
selection_background #45d5dc
cursor #45d5dc
cursor_text_color #09131d
background_image_layout cscaled
background_image_linear yes
background_tint 0.30
window_padding_width 18
remember_window_size yes
initial_window_width 1200
initial_window_height 750
enabled_layouts splits,tall,stack
tab_bar_edge top
tab_bar_style powerline
active_tab_foreground #45d5dc
active_tab_background #122735
inactive_tab_foreground #748a9f
inactive_tab_background #09131d
color0 #09131d
color1 #ed7784
color2 #72c9a7
color3 #e3c787
color4 #70aee5
color5 #b3a1db
color6 #45d5dc
color7 #dce7ee
color8 #526779
color9 #ff8b97
color10 #91dfbb
color11 #f2d69a
color12 #8bc4f7
color13 #cbb9f1
color14 #79e8ee
color15 #f4f8fb
allow_remote_control socket-only
map ctrl+shift+t new_tab
map ctrl+shift+enter launch --location=split
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+f toggle_fullscreen
