[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kedar-terminal"
version = "0.1.0"
description = "An isolated teal Kitty/Fish terminal with bilingual backgrounds and performance monitoring"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]
license = {text = "Apache-2.0"}

[project.scripts]
kedar-terminal = "kedar_terminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/kedar-terminal/assets" = ["assets/landscape.png", "assets/README.md"]
"share/kedar-terminal/config" = ["config/kitty.conf", "config/animation.toml", "config/starship.toml"]
"share/kedar-terminal/config/fish" = ["config/fish/config.fish"]
"share/kedar-terminal/config/fish/functions" = ["config/fish/functions/fish_greeting.fish", "config/fish/functions/fish_prompt.fish"]
