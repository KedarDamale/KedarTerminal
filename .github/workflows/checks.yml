name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fish fonts-noto-core fontconfig
      - run: python -m pip install .
      - run: make test check
      - run: fish --no-config --no-execute config/fish/config.fish
